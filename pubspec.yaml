name: devoo_tv
description: Devoo TV - canali TV per bambini e del mondo, con il PIN per i genitori.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  video_player: ^2.9.2
  wakelock_plus: ^1.2.8
  crypto: ^3.0.3
  http: ^1.2.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
