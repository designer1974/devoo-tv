name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Genera i file Android mancanti (gradle...) senza toccare i nostri
      - name: Prepara progetto Android
        run: |
          flutter create --platforms=android --org com.designer1974 --project-name devoo_tv .
          rm -f test/widget_test.dart

      - name: Dipendenze
        run: |
          report() { msg=$(grep -E "$2" "$1" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); [ -z "$msg" ] && msg=$(tail -40 "$1" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); echo "::error title=$3::$msg"; }
          flutter pub get > out.txt 2>&1 || { report out.txt "because|depends|incompatible|version solving" PubGet; exit 1; }

      - name: Controllo codice
        run: |
          report() { msg=$(grep -E "$2" "$1" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); [ -z "$msg" ] && msg=$(tail -40 "$1" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); echo "::error title=$3::$msg"; }
          flutter analyze --no-fatal-infos --no-fatal-warnings > out.txt 2>&1 || { report out.txt "error •" Analyze; exit 1; }

      - name: Test
        run: |
          report() { msg=$(grep -E "$2" "$1" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); [ -z "$msg" ] && msg=$(tail -40 "$1" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); echo "::error title=$3::$msg"; }
          flutter test > out.txt 2>&1 || { report out.txt "Expected|Actual|Error|error|FAILED|\\.dart:[0-9]+" Test; exit 1; }

      # Solo informazione: quanti canali per bambini ci sono adesso?
      - name: Controllo canali
        continue-on-error: true
        run: |
          n=$(curl -s -m 40 https://iptv-org.github.io/iptv/categories/kids.m3u | grep -c '^#EXTINF' || true)
          echo "::notice title=Canali Kids::$n canali per bambini"

      # Firma sempre uguale: ogni nuova versione si installa SOPRA la vecchia.
      # La chiave è scritta direttamente nel progetto Android (prima veniva ignorata
      # e ogni versione aveva una firma diversa).
      - name: Chiave di firma fissa
        run: |
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('android/app/build.gradle.kts')
          s = p.read_text()
          block = """    signingConfigs {
                  getByName("debug") {
                      storeFile = file("../../.github/test-signing.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }

          """
          if 'test-signing.keystore' not in s:
              s = s.replace('    buildTypes {', block.replace('\n        ', '\n') + '    buildTypes {', 1)
          p.write_text(s)
          assert 'test-signing.keystore' in s, 'firma non inserita'
          PY
          grep -n -A8 "signingConfigs" android/app/build.gradle.kts

      - name: Compila APK
        run: |
          report() { msg=$(grep -E "$2" "$1" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); [ -z "$msg" ] && msg=$(tail -40 "$1" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); echo "::error title=$3::$msg"; }
          flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=BUILD=${{ github.run_number }} > out.txt 2>&1 || { grep -A25 "What went wrong" out.txt > err.txt || true; grep -E "^e: |error:" out.txt | head -20 >> err.txt || true; report err.txt "." Build; exit 1; }
          tail -5 out.txt

      - name: Rinomina APK
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk DevooTV.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk DevooTV-telefoni-vecchi.apk
          ls -la *.apk

      # Controllo: l'APK deve avere SEMPRE la stessa firma, se no gli aggiornamenti non si installano
      - name: Controllo firma
        run: |
          signer=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          sha=$($signer verify --print-certs DevooTV.apk | grep -i "SHA-256" | head -1 | awk '{print $NF}')
          echo "Firma: $sha"
          [ "$sha" = "9cecaeba709181ae91b41241d4e3e0653f0afa0d55a5b91965b8daf4ac795dbc" ] || { echo "::error title=Firma::Firma sbagliata: $sha"; exit 1; }

      # Pubblica l'APK nella pagina "Releases" per scaricarlo dal telefono
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Devoo TV build ${{ github.run_number }}
          body: |
            📱 **DevooTV.apk** → per quasi tutti i telefoni.
            📱 **DevooTV-telefoni-vecchi.apk** → solo se il primo non si installa.
          files: |
            DevooTV.apk
            DevooTV-telefoni-vecchi.apk
          make_latest: true
